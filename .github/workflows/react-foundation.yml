name: SalesShop Gmail Build QA (Cloudflare toolchain)

on:
  push:
    branches:
      - qa/gmail-363-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-equivalent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use Cloudflare's Node major
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use Cloudflare's Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install dependencies with Bun
        run: bun install
      - name: Reproduce Cloudflare build
        run: npm run build
