name: SalesShop CI

# Cloudflare Workers Git integration owns production deployment.
# Never deploy to GitHub Pages or configure its custom domain from Actions.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salesshop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: TypeScript, unit tests, production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Use local-test defaults. Never inject a real customer Supabase session.
      VITE_SALES_SHOP_LOCAL_QC: '1'
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''
      VITE_BASE_PATH: '/'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # This repository currently has no npm lockfile; npm ci would fail.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit and regression tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Verify root-hosted asset paths
        run: |
          set -euo pipefail
          grep -Eq 'src="/assets/' dist/index.html
          grep -Eq 'href="/assets/' dist/index.html
          if grep -Eq '(src|href)="/SalesShop/' dist/index.html; then
            echo "Unexpected legacy /SalesShop/ asset path" >&2
            exit 1
          fi
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: salesshop-ci-diagnostics
          path: |
            artifacts/
            dist/
          retention-days: 7
          if-no-files-found: ignore
