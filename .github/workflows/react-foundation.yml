name: SalesShop Pages

on:
  push:
    branches:
      - architecture/react-foundation
      - main
  pull_request:
    branches:
      - architecture/react-foundation
      - main
  # Branch pushes and PRs build/test; only a push to main (or manual main dispatch) publishes.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Configure GitHub Pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v5
      - name: Supplier importer regression tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
        env:
          # Custom-domain deployment is at the origin root, not /SalesShop/.
          VITE_BASE_PATH: '/'
      - name: Verify custom-domain asset paths
        run: |
          grep -Eq 'src="/assets/' dist/index.html
          grep -Eq 'href="/assets/' dist/index.html
          if grep -Eq '(src|href)="/SalesShop/' dist/index.html; then
            echo "Built HTML still uses the old /SalesShop/ base path" >&2
            exit 1
          fi
      - name: Add GitHub Pages SPA fallback
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          printf 'app.salesshop.work\n' > dist/CNAME
      - name: Upload GitHub Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: sales-shop-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test production HTML and asset delivery
        run: |
          set -euo pipefail
          url="https://app.salesshop.work/"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 8 --retry-all-errors "$url" -o /tmp/salesshop-index.html
          grep -Eq 'src="/assets/' /tmp/salesshop-index.html
          asset="$(grep -oE 'src="/assets/[^"]+' /tmp/salesshop-index.html | head -n 1 | cut -d '"' -f 2)"
          test -n "$asset"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 8 --retry-all-errors "https://app.salesshop.work$asset" -o /dev/null
          echo "SalesShop HTML and hashed application asset are reachable."
