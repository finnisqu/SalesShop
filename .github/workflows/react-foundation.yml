name: SalesShop Pages

on:
  push:
    branches:
      - architecture/react-foundation
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Supplier importer regression tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
        env:
          # Custom-domain deployment is at the origin root, not /SalesShop/.
          VITE_BASE_PATH: '/'
      - name: Verify custom-domain asset paths
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const html = fs.readFileSync('dist/index.html', 'utf8');
          if (!html.includes('src=\"/assets/') || !html.includes('href=\"/assets/')) {
            console.error('Built HTML does not point to root-relative JS/CSS assets.');
            process.exit(1);
          }
          if (/\\b(?:src|href)=\"\\/SalesShop\\//.test(html)) {
            console.error('Built HTML still uses legacy /SalesShop/ paths.');
            process.exit(1);
          }
          "
      - name: Add GitHub Pages SPA fallback
        if: github.event_name != 'pull_request'
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: sales-shop-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
