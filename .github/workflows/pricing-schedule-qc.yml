name: Pricing Schedule Workbook QC

on:
  push:
    branches:
      - architecture/react-foundation
    paths:
      - 'src/services/pricingSchedule*'
      - 'src/components/PricingSchedule*'
      - 'src/components/PricingDocumentEditor.tsx'
      - 'src/components/NewSalesDocumentPicker.tsx'
      - 'src/components/SalesDocumentToolbar.tsx'
      - 'src/components/QuotesMobileBeta.tsx'
      - 'src/components/QuoteBetaHistory.tsx'
      - 'src/components/QuoteBetaDesktopRails.tsx'
      - 'src/store/quoteStore.ts'
      - 'src/services/quoteIntegrity.ts'
      - 'src/services/quoteDocumentCopy*'
      - 'src/sales-document-workspace.css'
      - 'src/services/salesDocumentTemplates*'
      - 'src/services/salesDocumentLibrary*'
      - 'src/services/stockBuilderRateTemplate*'
      - 'src/sales-documents.css'
      - 'src/components/PricingManual*'
      - 'src/components/PricingContract*'
      - 'src/services/pricingScheduleContract*'
      - 'src/services/pricingScheduleCombinations*'
      - 'src/pricing-schedule.css'
      - 'src/pricing-schedule-manual.css'
      - 'e2e/pricing-schedule-workbook.pw.ts'
      - 'e2e/pricing-schedule-contract.pw.ts'
      - 'e2e/pricing-schedule-manual.pw.ts'
      - 'e2e/pricing-schedule-calculated.pw.ts'
      - 'e2e/sales-document-templates.pw.ts'
      - 'e2e/sales-document-workspace.pw.ts'
      - 'e2e/sales-document-library.pw.ts'
      - '.github/workflows/pricing-schedule-qc.yml'
  pull_request:
    branches:
      - architecture/react-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbook-qc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workbook-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''
      VITE_BASE_PATH: '/'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Workbook unit tests
        run: npx vitest run src/services/pricingSchedule.test.ts src/services/pricingScheduleContract.test.ts src/services/pricingScheduleManual.test.ts src/services/pricingScheduleBuilderVariants.test.ts src/services/salesDocumentTemplates.test.ts src/services/stockBuilderRateTemplate.test.ts src/services/quoteDocumentCopy.test.ts src/services/salesDocumentLibrary.test.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Focused workbook browser tests
        run: npx playwright test e2e/pricing-schedule-workbook.pw.ts e2e/pricing-schedule-contract.pw.ts e2e/pricing-schedule-manual.pw.ts e2e/pricing-schedule-calculated.pw.ts e2e/sales-document-templates.pw.ts e2e/sales-document-workspace.pw.ts e2e/sales-document-library.pw.ts --project=desktop-1280 --project=phone-390
      - name: Upload workbook failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pricing-schedule-browser-qc
          path: |
            artifacts/playwright-results/
            artifacts/playwright-report/
          if-no-files-found: ignore
          retention-days: 10
