name: SalesShop Navigation Smoke

# Cloudflare Workers deploys production separately; this is manual release validation only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navigation-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      VITE_SALES_SHOP_LOCAL_QC: '1'
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''
      VITE_BASE_PATH: '/'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      # Hosted Ubuntu normally has Chromium runtime libraries already installed.
      # Do not run Playwright's apt-get --with-deps here: Nov 11's runner DNS
      # could not resolve Ubuntu mirrors, preventing browser tests from starting.
      - name: Install Chromium browser only
        run: npx playwright install chromium
      - name: Legacy sink pricing browser acceptance (synthetic quote, phone and desktop)
        run: npm run test:sink-parity:browser
      - name: HOME and Deal record navigation (phone and desktop)
        run: npx playwright test e2e/home-journey.pw.ts e2e/connections-deal-record.pw.ts e2e/quotes-beta-fast-path.pw.ts e2e/quotes-beta-details-slim.pw.ts e2e/board-viewport.pw.ts --project=phone-390 --project=desktop-1280
      - name: Upload failed navigation traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: salesshop-navigation-smoke
          path: |
            artifacts/playwright-results/
            artifacts/playwright-report/
          retention-days: 10
