<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SalesShop Prototype</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="workspace.css" />
  <link rel="stylesheet" href="tuning.css" />
  <link rel="stylesheet" href="notebook-pages.css" />
</head>
<body data-view="board">
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-inline">
        <div class="brand-mark">S</div>
        <div class="brand-name">SalesShop</div>
      </div>

      <nav class="top-tabs" id="nav" aria-label="SalesShop sections">
        <button class="top-tab tab-notebook" data-view="notebook"><span class="tab-dot"></span>Notebook</button>
        <button class="top-tab tab-board active" data-view="board"><span class="tab-dot"></span>Board</button>
        <button class="top-tab tab-quotes" data-view="quotes"><span class="tab-dot"></span>Quotes</button>
        <button class="top-tab tab-memory" data-view="memory"><span class="tab-dot"></span>Memory</button>
      </nav>

      <div class="header-tools">
        <div class="command-wrap">
          <span class="command-icon">⌕</span>
          <input id="commandInput" class="command-input" placeholder="Search or remember…" autocomplete="off" />
          <span class="command-hint">⌘K</span>
          <div id="commandResults" class="command-results hidden"></div>
        </div>
        <button class="top-icon-button" id="themeToggleBtn" title="Switch theme">☀</button>
        <button class="primary-button compact-new" id="quickNewBtn">+ New</button>
      </div>
    </header>

    <main class="workspace-body" id="workspaceBody">
      <section id="view-home" class="view legacy-view"></section>
      <section id="view-board" class="view active page-accent-board"></section>
      <section id="view-notebook" class="view notebook-placeholder"></section>
      <section id="view-quotes" class="view page-accent-quotes"></section>
      <section id="view-memory" class="view page-accent-memory"></section>
      <section id="notebookDock" class="notebook-dock"></section>
    </main>
  </div>

  <div class="utility-corner">
    <button class="quiet-button" id="resetDemoBtn">Reset demo</button>
  </div>
  <div id="toast" class="toast hidden"></div>
  <div id="modalRoot"></div>
  <template id="modalTemplate">
    <div class="modal-backdrop"><div class="modal-card"><div class="modal-header"><div><div class="eyebrow modal-eyebrow"></div><h2 class="modal-title"></h2></div><button class="icon-button modal-close" aria-label="Close">×</button></div><div class="modal-body"></div></div></div>
  </template>

  <script src="js/core.js"></script>
  <script src="js/work.js"></script>
  <script src="js/notebook.js"></script>
  <script src="js/quotes.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/init.js"></script>
</body>
</html>
